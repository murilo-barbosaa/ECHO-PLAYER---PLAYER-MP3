<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Player</title>
<style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #030303;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .player-card {
            background: #000000;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #FFFFFF;
        }

        /* Estilização da Logo */
        .logo-container {
            text-align: center;
            margin-bottom: 12px;
        }
        .player-logo {
            max-width: 120px; 
            height: auto;
            object-fit: contain;
        }

        h2 { font-size: 1.25rem; margin-bottom: 12px; text-align: center; color: #fdfdfd; }
        
        canvas {
            width: 100%;
            height: 120px;
            background: #000000;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333333;
        }

        .file-input-container {
            margin-bottom: 20px;
            text-align: center;
        }
        input[type="file"] { display: none; }
        .file-label {
            background: #ffffff;
            color: #000000;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            transition: 0.2s;
        }
        .file-label:hover { background: #e6e6e6; }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
        input[type="range"] {
            width: 60%;
            accent-color: #ffffff;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        
        button {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            transition: 0.2s;
        }
        
        button:hover:not(:disabled) { 
            background-color: #e6e6e6 !important;
            transform: translateY(-1px);
        }
        
        button:disabled { 
            background-color: #ffffff !important;
            color: rgba(0, 0, 0, 0.4) !important;
            cursor: not-allowed; 
        }
    </style>
</head>
<body>

<div class="player-card">
    <!-- Adicionado o Container e a Tag de Imagem da Logo -->
    <div class="logo-container">
        <img src="echo player logo.png" alt="Echo Player Logo" class="player-logo">
    </div>

    <h2></h2>
    
    <canvas id="visualizer"></canvas>

    <div class="file-input-container">
        <label for="audioFile" class="file-label">Escolher Música</label>
        <input type="file" id="audioFile" accept="audio/*">
        <span id="fileName" style="display:block; margin-top: 8px; font-size: 0.8rem; color: #a1a1aa;">Nenhum arquivo selecionado</span>
    </div>

    <div class="controls-group">
        <div class="control-row">
            <label>Volume</label>
            <input type="range" id="volume" min="0" max="2" step="0.01" value="1">
        </div>
        <div class="control-row">
            <label>Graves (Bass Boost)</label>
            <input type="range" id="bass" min="-20" max="20" step="1" value="0">
        </div>
        <div class="control-row">
            <label>Balanço (L / R)</label>
            <input type="range" id="pan" min="-1" max="1" step="0.1" value="0">
        </div>
    </div>

    <div class="buttons">
        <button id="playBtn" disabled>Play</button>
        <button id="pauseBtn" disabled>Pause</button>
    </div>
</div>

<audio id="audioElement"></audio>

<script>
    const audioElement = document.getElementById('audioElement');
    const audioFileInput = document.getElementById('audioFile');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    
    const volumeControl = document.getElementById('volume');
    const bassControl = document.getElementById('bass');
    const panControl = document.getElementById('pan');

    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    let audioCtx;
    let trackSource;
    let gainNode;
    let bassFilter;
    let pannerNode;
    let analyserNode;
    let isInitialized = false;

    function initWebAudio() {
        if (isInitialized) return;

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        trackSource = audioCtx.createMediaElementSource(audioElement);
        gainNode = audioCtx.createGain();
        
        bassFilter = audioCtx.createBiquadFilter();
        bassFilter.type = 'lowshelf';
        bassFilter.frequency.value = 250;

        pannerNode = audioCtx.createStereoPanner();

        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 64;

        trackSource
            .connect(bassFilter)
            .connect(gainNode)
            .connect(pannerNode)
            .connect(analyserNode)
            .connect(audioCtx.destination);

        isInitialized = true;
        drawVisualizer();
    }

    audioFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            document.getElementById('fileName').textContent = file.name;
            audioElement.src = URL.createObjectURL(file);
            playBtn.disabled = false;
            pauseBtn.disabled = false;
        }
    });

    playBtn.addEventListener('click', () => {
        initWebAudio();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        audioElement.play();
    });

    pauseBtn.addEventListener('click', () => {
        audioElement.pause();
    });

    volumeControl.addEventListener('input', (e) => {
        if (gainNode) gainNode.gain.value = e.target.value;
    });

    bassControl.addEventListener('input', (e) => {
        if (bassFilter) bassFilter.gain.value = e.target.value;
    });

    panControl.addEventListener('input', (e) => {
        if (pannerNode) pannerNode.pan.value = e.target.value;
    });

    function drawVisualizer() {
        requestAnimationFrame(drawVisualizer);

        const bufferLength = analyserNode.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyserNode.getByteFrequencyData(dataArray);

        canvasCtx.fillStyle = '#000000';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 1.5;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * canvas.height;

            canvasCtx.fillStyle = `hsl(0, 0%, ${60 + (dataArray[i] / 255) * 40}%)`;
            canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);

            x += barWidth;
        }
    }
</script>
</body>
</html>
